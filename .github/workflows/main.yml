name: Update Google News RSS and deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      full_rescan:
        description: "Tarik ulang seluruh data sejak 1 Januari 2026"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repository
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik Google News RSS
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_rescan }}" == "true" ]]; then
            python3 scripts/fetch_news.py --full
          else
            python3 scripts/fetch_news.py
          fi

      - name: Simpan pembaruan CSV dan JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/news.csv public/data/news.json public/data/meta.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: perbarui Google News RSS"
            git push
          fi

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Pasang dependensi
        run: npm ci

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Bangun dashboard
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY%%/*}"
          if [[ "$repo_name" == "$owner_name.github.io" ]]; then
            export PAGES_BASE_PATH=""
          else
            export PAGES_BASE_PATH="/$repo_name"
          fi
          npm run build
          node scripts/prepare_github_pages.mjs

      - name: Unggah hasil build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Terbitkan GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
